[project]
name = "sahamlens-core"
version = "0.1.0"
description = "SahamLens Python data core — framework-independent."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Trancend1" }]

dependencies = [
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "mypy>=1.11.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/core"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["packages/core", "scripts", "tests"]
mypy_path = "packages"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/core"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["packages/core"]
omit = ["**/__init__.py"]

[tool.coverage.report]
fail_under = 70
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
