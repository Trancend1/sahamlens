# Pre-commit hooks for SahamLens.
# Install: `pre-commit install`. Run all: `pre-commit run --all-files`.
# Detail aturan: .docs/SECURITY.md §3.2 dan .docs/ENGINEERING_STANDARDS.md §4.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
        exclude: ^apps/web/tsconfig\.json$
      - id: check-toml
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(pnpm-lock\.yaml|uv\.lock)$

  - repo: local
    hooks:
      - id: no-private-leak
        name: no_private_leak (block data/private + config/*.yml + .env*)
        entry: python scripts/no_private_leak.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
